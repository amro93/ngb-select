name: Publish NPM Package

on:
  release:
    types: [published]
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  publish:
    name: Build and Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for NPM Trusted Publishing (OIDC) & Provenance

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test

      - name: Build ngb-select Library
        run: npm run build:lib

      - name: Publish to NPM
        run: npm publish ./dist/ngb-select --access public --provenance
