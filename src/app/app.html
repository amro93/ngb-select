<!-- Navbar -->
<app-navbar
  [appVersion]="appVersion"
  [isDarkMode]="isDarkMode"
  (themeToggle)="toggleTheme()"
></app-navbar>

<div class="container py-4 my-2">
  <!-- Hero Section -->
  <app-hero-section
    [countries]="countries"
    [(selectedCountries)]="selectedHeroCountries"
  ></app-hero-section>

  <!-- Main Content Grid with Vertical Sticky Sidebar & Adaptive Mobile Dropdown -->
  <div class="row g-4" id="examples">
    <!-- Vertical Navigation Sidebar -->
    <div class="col-lg-3">
      <app-sidebar-nav></app-sidebar-nav>
    </div>

    <!-- Right Content Area (col-lg-9) -->
    <div class="col-lg-9">
      <!-- 28 Showcase Demos -->
      <app-showcase-demos></app-showcase-demos>

      <!-- API Reference Table Section -->
      <div class="col-12" id="api-reference">
        <app-api-reference [appVersion]="appVersion"></app-api-reference>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <app-footer [appVersion]="appVersion"></app-footer>
</div>
